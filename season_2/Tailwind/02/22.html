<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen breakpoints in Tailwind css</title>
    <link rel="stylesheet" href="output_9.css">
</head>

<body>
    <div class="p-4">
        <h1 class="text-base text-center sm:text-lg md:text-xl lg:text-2xl xl:text-3xl 2xl:text-4xl font-bold">
            Responsive Heading
        </h1>

        <p class="text-sm text-center sm:text-base md:text-lg lg:text-xl xl:text-2xl">
            Resize the screen to see text size change at different breakpoints.
        </p>

        <div class="mt-6">
            <div
                class="bg-red-400 sm:bg-green-400 md:bg-blue-400 lg:bg-yellow-400 xl:bg-purple-400 2xl:bg-pink-400 p-6 rounded-lg text-white text-center">
                Background color changes with screen size.
            </div>
        </div>
    </div>

</body>

</html>
