<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Dark Clone</title>
  <link rel="stylesheet" href="output_9.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#202124] text-gray-200 flex flex-col min-h-screen">

  <!-- Top Navbar -->
  <header class="flex justify-between items-center px-6 py-4 text-sm">
    <div class="flex gap-4">
      <a href="#" class="hover:underline">About</a>
      <a href="#" class="hover:underline">Store</a>
    </div>

    <div class="flex items-center gap-4">
      <a href="#" class="hover:underline">Gmail</a>
      <a href="#" class="hover:underline">Images</a>

      <!-- Flask icon -->
      <button class="p-2 rounded-full hover:bg-gray-700 transition">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor"
             viewBox="0 0 24 24" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 2v6l-6 10h18l-6-10V2z"/>
        </svg>
      </button>

      <!-- Grid icon -->
      <button class="p-2 rounded-full hover:bg-gray-700 transition">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor"
             viewBox="0 0 24 24" class="w-5 h-5">
          <circle cx="5" cy="5" r="2"/>
          <circle cx="12" cy="5" r="2"/>
          <circle cx="19" cy="5" r="2"/>
          <circle cx="5" cy="12" r="2"/>
          <circle cx="12" cy="12" r="2"/>
          <circle cx="19" cy="12" r="2"/>
          <circle cx="5" cy="19" r="2"/>
          <circle cx="12" cy="19" r="2"/>
          <circle cx="19" cy="19" r="2"/>
        </svg>
      </button>

      <!-- Profile avatar -->
      <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center text-white font-bold cursor-pointer">
        S
      </div>
    </div>
  </header>

  <!-- Main Section -->
  <main class="flex-1 flex flex-col justify-center items-center">
    <!-- Google Logo -->
    <h1 class="text-6xl sm:text-7xl font-sans font-bold mb-8">
      <span class="text-blue-500">G</span>
      <span class="text-red-500">o</span>
      <span class="text-yellow-500">o</span>
      <span class="text-blue-500">g</span>
      <span class="text-green-500">l</span>
      <span class="text-red-500">e</span>
    </h1>

    <!-- Search bar -->
    <div class="w-full max-w-2xl px-4">
      <form class="flex items-center bg-[#303134] rounded-full px-4 py-3 border border-gray-700">
        <!-- Search icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/>
        </svg>

        <!-- Input -->
        <input type="text" placeholder="Search Google or type a URL"
               class="flex-1 bg-transparent outline-none px-3 text-sm text-gray-200 placeholder-gray-400"/>

        <!-- Mic -->
        <button type="button" class="p-2 hover:bg-gray-700 rounded-full transition">
          <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor"
               class="w-5 h-5 text-red-400" viewBox="0 0 24 24">
            <path d="M12 14a3 3 0 003-3V6a3 3 0 10-6 0v5a3 3 0 003 3z"/>
            <path d="M19 11a7 7 0 01-14 0"/>
            <path d="M12 17v4"/>
          </svg>
        </button>

        <!-- AI Mode -->
        <button type="button" class="ml-2 px-3 py-1 text-xs bg-gray-600 hover:bg-gray-500 rounded-full transition">AI Mode</button>
      </form>

      <!-- Buttons -->
      <div class="flex justify-center gap-4 mt-6">
        <button class="bg-[#303134] px-4 py-2 rounded text-sm hover:border hover:border-gray-500">Google Search</button>
        <button class="bg-[#303134] px-4 py-2 rounded text-sm hover:border hover:border-gray-500">I'm Feeling Lucky</button>
      </div>

      <!-- Languages -->
      <p class="text-center text-sm text-gray-400 mt-4">
        Google offered in:
        <a href="#" class="text-blue-400 hover:underline px-1">हिन्दी</a>
        <a href="#" class="text-blue-400 hover:underline px-1">বাংলা</a>
        <a href="#" class="text-blue-400 hover:underline px-1">తెలుగు</a>
        <a href="#" class="text-blue-400 hover:underline px-1">मराठी</a>
        <a href="#" class="text-blue-400 hover:underline px-1">தமிழ்</a>
        <a href="#" class="text-blue-400 hover:underline px-1">ગુજરાતી</a>
        <a href="#" class="text-blue-400 hover:underline px-1">ಕನ್ನಡ</a>
        <a href="#" class="text-blue-400 hover:underline px-1">മലയാളം</a>
        <a href="#" class="text-blue-400 hover:underline px-1">ਪੰਜਾਬੀ</a>
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-[#171717] text-gray-400 text-sm">
    <div class="px-6 py-3 border-b border-gray-700">India</div>
    <div class="flex flex-col sm:flex-row justify-between px-6 py-3">
      <div class="flex gap-6 mb-2 sm:mb-0">
        <a href="#" class="hover:underline">Advertising</a>
        <a href="#" class="hover:underline">Business</a>
        <a href="#" class="hover:underline">How Search works</a>
      </div>
      <div class="flex gap-6">
        <a href="#" class="hover:underline">Privacy</a>
        <a href="#" class="hover:underline">Terms</a>
        <a href="#" class="hover:underline">Settings</a>
      </div>
    </div>
  </footer>

</body>
</html>
