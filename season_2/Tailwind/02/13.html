<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filters with Tailwind css</title>
    <link rel="stylesheet" href="output_9.css">
</head>

<body>
    <h1 class="text-center text-4xl font-bold border-4 border-cyan-300 text-blue-600 px-6 py-2 rounded-lg mx-auto mt-10">BLUR</h1>
    <div class="flex flex-wrap [&>*]:m-5">
        <!-- <div class="flex overflow-x-hidden [&>*]:m-5">  -->
        <img src="1.webp" alt="Actress" class="h-223">
        <img src="1.webp" class="blur-5m h-223">
        <img src="1.webp" class="blur-md h-223">
        <img src="1.webp" class="blur-3xl h-223">
        <img src="1.webp" class="blur h-223 pr-5">
    </div>

<h1 class="text-center text-4xl font-bold border-4 border-cyan-300 text-blue-600 px-6 py-2 rounded-lg mx-auto mt-10">BRIGHTNESS</h1>
    <div class="flex flex-wrap [&>*]:m-5">
        <img src="1.webp" alt="" class="brightness-50 h-223">
        <img src="1.webp" alt="" class="brightness-100 h-223">
        <img src="1.webp" alt="" class="brightness-200 h-223">
        <img src="1.webp" alt="" class="brightness-900 h-223">
        <img src="1.webp" alt="" class="brightness-300 h-223">
        <img src="1.webp" alt="" class="brightness-400 h-223">
        <!-- <img src="1.webp" alt="" class="brightness-500 h-223"> -->
    </div>

    <h1 class="text-center text-4xl font-bold border-4 border-cyan-300 text-blue-600 px-6 py-2 rounded-lg mx-auto mt-10">CONTRAST</h1>
    <div class="flex flex-wrap [&>*]:m-5">
        <img src="1.webp" alt="" class="contrast-0 h-223">
        <img src="1.webp" alt="" class="contrast-50 h-223">
        <img src="1.webp" alt="" class="contrast-100 h-223">
        <img src="1.webp" alt="" class="contrast-125 h-223">
        <img src="1.webp" alt="" class="contrast-200 h-223">
        <img src="1.webp" alt="" class="contrast-900 h-223">
        <img src="1.webp" alt="" class="contrast-300 h-223">
        <img src="1.webp" alt="" class="contrast-400 h-223">
        <!-- <img src="1.webp" alt="" class="brightness-500 h-223"> -->
    </div>

    <h1 class="text-center text-4xl font-bold border-4 border-cyan-300 text-blue-600 px-6 py-2 rounded-lg mx-auto mt-10">GRAYSCALE</h1>
    <div class="flex flex-wrap [&>*]:m-5">
        <img src="1.webp" alt="" class="grayscale h-223">
    </div>
    
    <h1 class="text-center text-4xl font-bold border-4 border-cyan-300 text-blue-600 px-6 py-2 rounded-lg mx-auto mt-10">INVERT</h1>
    <div class="flex flex-wrap [&>*]:m-5">
        <img src="1.webp" alt="" class="invert h-223">
    </div>
    
    <h1 class="text-center text-4xl font-bold border-4 border-cyan-300 text-blue-600 px-6 py-2 rounded-lg mx-auto mt-10">HUE</h1>
    <div class="flex flex-wrap [&>*]:m-5">
        <img src="1.webp" alt="" class="hue-rotate-15 h-223">
        <img src="1.webp" alt="" class="hue-rotate-60 h-223">
        <img src="1.webp" alt="" class="hue-rotate-90 h-223">
        <img src="1.webp" alt="" class="hue-rotate-150 h-223">
        <img src="1.webp" alt="" class="hue-rotate-250 h-223">
        <img src="1.webp" alt="" class="hue-rotate-300 h-223">
        <img src="1.webp" alt="" class="hue-rotate-450 h-223">
        <img src="1.webp" alt="" class="hue-rotate-550 h-223">
        <img src="1.webp" alt="" class="hue-rotate-600 h-223">
        <img src="1.webp" alt="" class="hue-rotate-750 h-223">
        <img src="1.webp" alt="" class="hue-rotate-850 h-223">
        <img src="1.webp" alt="" class="hue-rotate-950 h-223">
    </div>
</body>

</html>
