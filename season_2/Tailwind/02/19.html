<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition with Tailwind CSS</title>
    <link rel="stylesheet" href="output_9.css">
</head>

<body class="">
    <button class="bg-blue-500 p-2 m-10 text-white rounded hover:bg-blue-900">
        Button 1
    </button>

    <button class="bg-blue-500 p-2 m-10 text-white rounded hover:bg-blue-900 transition duration-1000">
        Button 2
    </button>

    <button class="bg-blue-500 p-2 m-10 text-white rounded hover:bg-blue-900 transition duration-1000">
        Button 3
    </button>

    <button class="bg-red-500 p-2 m-10 text-white rounded hover:rotate-180 transition-transform duration-1000">
        Button 4
    </button>

    <button class="bg-red-500 p-2 m-10 text-white rounded hover:scale-150 transition-transform duration-1000">
        Button 4
    </button>

    <button
        class="bg-red-500 p-2 m-10 text-white rounded hover:scale-x-150 hover:scale-y-50 transition-transform duration-1000">
        Button 4
    </button>

    <img src="1.webp" alt="Actress"
        class="m-auto mt-55 w-56 hover:rotate-45 hover:scale-125 transition-transform duration-1000 justify-between" />

    <div class="m-auto mt-4 mb-4 w-156 h-156 overflow-hidden flex items-center justify-center rounded-lg">
        <img src="1.webp" alt="Actress"
            class="w-full h-full object-contain transition-transform duration-700 hover:scale-125 " />
    </div>

    <div class="m-auto mt-14 w-56 h-56 overflow-hidden rounded-lg">
        <img src="1.webp" alt="Actress"
            class="w-full h-full object-cover transition-transform duration-700 hover:scale-125" />
    </div>

    <div class="m-auto mt-4 mb-4 w-156 h-156 overflow-hidden flex rounded-lg bg-gray-200">
        <img src="1.webp" alt="Actress"
            class="w-full h-full object-contain transition-transform duration-700 hover:scale-125" />
    </div>

</body>

</html>
