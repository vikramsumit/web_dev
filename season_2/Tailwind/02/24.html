<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dark Mode with Tailwind CSS</title>

  <!-- ✅ Tailwind CSS from CDN with darkMode: 'class' -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // ✅ Enable dark mode via class strategy
    tailwind.config = {
      darkMode: 'class'
    };
  </script>

  <!-- ✅ Optional: Smooth transition -->
  <style>
    .transition-colors {
      transition: background-color 0.3s, color 0.3s;
    }
  </style>
</head>

<body class="transition-colors">

  <!-- ✅ Dark Mode Toggle Switch -->
  <div class="flex justify-end items-center p-4">
    <label class="flex items-center cursor-pointer">
      <span class="mr-2 text-gray-700 dark:text-gray-300">☀️</span>
      <input type="checkbox" id="dark-toggle" class="hidden" />
      <div class="w-10 h-5 bg-gray-300 dark:bg-gray-600 rounded-full p-1 flex items-center">
        <div class="w-4 h-4 bg-white rounded-full shadow-md transform transition-transform duration-300 toggle-circle"></div>
      </div>
      <span class="ml-2 text-gray-700 dark:text-gray-300">🌙</span>
    </label>
  </div>

  <!-- ✅ Content -->
  <div class="p-6 dark:bg-slate-800 min-h-screen">
    <h1 class="text-3xl mb-4 text-gray-900 dark:text-white">This is dark mode</h1>
    <p class="mb-4 text-gray-700 dark:text-gray-300">This is a paragraph in dark mode</p>
    <!-- <button class="bg-blue-500 text-white px-4 py-2 rounded dark:bg-blue-700">Dark Mode Button</button> -->

    <div class="mt-10 p-4 border border-slate-700 dark:bg-slate-600 dark:border-red-500">
      <h2 class="text-gray-900 dark:text-white">Box with dark mode</h2>
    </div>
  </div>

  <!-- ✅ JavaScript: Dark Mode Toggle with LocalStorage -->
  <script>
    const toggle = document.getElementById('dark-toggle');
    const html = document.documentElement;

    // Load saved mode from localStorage
    if (localStorage.getItem('theme') === 'dark') {
      html.classList.add('dark');
      toggle.checked = true;
    }

    toggle.addEventListener('change', function () {
      if (toggle.checked) {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      } else {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      }
    });
  </script>
</body>
</html>
