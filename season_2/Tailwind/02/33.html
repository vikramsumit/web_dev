<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown with Tailwind css</title>
    <link rel="stylesheet" href="output_9.css">
</head>

<body>
    <div class="relative group m-10 w-40">
        <!-- Dropdown Button -->
        <div class="text-blue-500 font-semibold bg-blue-100 px-4 py-2 rounded-md cursor-pointer 
           hover:bg-blue-200 hover:text-blue-700 transition duration-300 ease-in-out">
            City List
        </div>

        <!-- Dropdown Menu -->
        <div class="hidden group-hover:block absolute left-0 mt-2 bg-white shadow-lg rounded-md w-40 overflow-hidden">
            <ul class="text-gray-700">
                <li>
                    <a href="#" class=".dropdown">
                        Delhi
                    </a>
                </li>
                <li>
                    <a href="#" class=".dropdown">
                        Noida
                    </a>
                </li>
                <li>
                    <a href="#" class=".dropdown">
                        Gurgaon
                    </a>
                </li>
                <li>
                    <a href="#" class=".dropdown">
                        Hisar
                    </a>
                </li>
            </ul>
        </div>
    </div>

</body>

</html>
