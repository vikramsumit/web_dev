<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Inspired Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
    
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">
    <div class="layout">
      <!-- Sidebar -->
      <aside class="sidebar panel" aria-label="Sidebar">
        <div class="logo" title="Spotify Inspired">
          <div class="logo-bullet"></div>
          <span class="hide-sm">Sonic</span>
        </div>

        <nav class="nav">
          <a href="#" aria-label="Home">🏠 <span class="hide-sm">Home</span></a>
          <a href="#" aria-label="Search">🔎 <span class="hide-sm">Search</span></a>
          <a href="#" aria-label="Your Library">📚 <span class="hide-sm">Your Library</span></a>
        </nav>

        <div class="library">
          <button id="newPlaylistBtn">➕
            <input type="file" id="fileInput" accept="music/*" multiple style="display:none" />
            <button id="uploadBtn">📂 Add Local Music</button>
            <span class="hide-sm">New playlist</span></button>
          <button id="likedBtn">💚 <span class="hide-sm">Liked songs</span> <span id="likedCount"
              class="badge">0</span></button>
          <p class="small hide-sm">Keyboard: <span class="kbd">Space</span> play/pause, <span class="kbd">←/→</span>
            seek, <span class="kbd">↑/↓</span> volume.</p>
        </div>
      </aside>

      <!-- Main content -->
      <main class="main panel" aria-label="Main content">
        <div class="topbar">
          <div class="search">
            <span class="icon">🔎</span>
            <input id="search" type="text" placeholder="What do you want to listen to?" aria-label="Search" />
          </div>
          <button id="shuffleBtn" class="chip" title="Toggle Shuffle">Shuffle</button>
          <button id="repeatBtn" class="chip" title="Toggle Repeat">Repeat</button>
        </div>

        <section class="section">
          <h2>Made for you</h2>
          <div id="cards" class="grid" role="list"></div>
        </section>

        <section class="section tracks">
          <table aria-label="Tracks table">
            <thead>
              <tr>
                <th>#</th>
                <th>Title</th>
                <th>Album</th>
                <th>Duration</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tracksTbody"></tbody>
          </table>
        </section>
      </main>
    </div>

    <!-- Player -->
    <footer class="player">
      <div class="now" aria-live="polite">
        <img id="nowCover" alt="cover" src="" />
        <div>
          <div id="nowTitle" class="t">—</div>
          <div id="nowArtist" class="a">—</div>
        </div>
      </div>

      <div class="controls">
        <div class="row">
          <button class="btn ghost" id="prevBtn" title="Previous">⏮</button>
          <button class="btn brand" id="playBtn" title="Play/Pause">▶</button>
          <button class="btn ghost" id="nextBtn" title="Next">⏭</button>
        </div>
        <div class="progress">
          <div id="currentTime" class="time">0:00</div>
          <input id="seek" type="range" min="0" max="100" value="0" />
          <div id="totalTime" class="time">0:00</div>
        </div>
      </div>

      <div class="right">
        <span class="pill">Queue: <span id="queueCount">0</span></span>
        <span>🔊</span>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" title="Volume" />
      </div>
      <audio id="audio"></audio>
    </footer>
  </div>

  <script src="script.js"></script>
</body>

</html>
