<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Inspired Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --bg-elev: #121212;
      --card: #181818;
      --muted: #a7a7a7;
      --text: #fff;
      --brand: #1db954;
      --brand-700: #169c45;
      --brand-800: #12833a;
      --border: #2a2a2a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #0e0e0e 0%, #000 60%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      letter-spacing: 0.2px;
    }

    .app {
      display: grid;
      grid-template-rows: 1fr auto;
      height: 100dvh;
      width: 100%;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 12px;
      padding: 12px 12px 0 12px;
    }

    .panel {
      background: var(--bg-elev);
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    /* Sidebar */
    .sidebar {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .logo {
      font-weight: 800;
      font-size: 20px;
      letter-spacing: .5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-bullet {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--brand);
      box-shadow: 0 0 18px rgba(29, 185, 84, .55);
    }

    .nav,
    .library {
      display: grid;
      gap: 6px;
    }

    .nav a,
    .library button {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: transparent;
      border: 0;
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      transition: background .2s ease, transform .08s ease;
      font-weight: 500;
      font-size: 14px;
    }

    .nav a:hover,
    .library button:hover {
      background: #202020;
    }

    .nav a:active,
    .library button:active {
      transform: scale(.98);
    }

    .small {
      color: var(--muted);
      font-size: 12px;
    }

    /* Main */
    .main {
      padding: 16px;
      overflow: auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search {
      flex: 1;
      position: relative;
    }

    .search input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #0f0f0f;
      color: var(--text);
      outline: none;
      font-size: 14px;
    }

    .search .icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      opacity: .7;
    }

    .chip {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #0f0f0f;
      font-size: 12px;
    }

    .section {
      margin-top: 18px;
    }

    .section h2 {
      font-size: 20px;
      margin: 0 0 10px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
    }

    @media (max-width: 1200px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 70px 1fr;
      }

      .hide-sm {
        display: none;
      }

      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .card {
      background: linear-gradient(180deg, #1a1a1a, #121212);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: grid;
      gap: 10px;
      padding: 10px;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, .45);
    }

    .cover {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 10px;
      object-fit: cover;
      background: #222;
    }

    .title {
      font-weight: 700;
      font-size: 14px;
      line-height: 1.3;
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
    }

    .like {
      margin-left: auto;
      border: 1px solid var(--border);
      background: #0f0f0f;
      color: var(--text);
      border-radius: 10px;
      padding: 6px 8px;
      font-size: 12px;
    }

    /* Tracks table */
    .tracks {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #1f1f1f;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .4px;
      text-transform: uppercase;
    }

    tr:hover td {
      background: #151515;
    }

    /* Player */
    .player {
      display: grid;
      grid-template-columns: 1.2fr 1.4fr 1fr;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      background: rgba(18, 18, 18, .95);
      backdrop-filter: blur(6px);
    }

    @media (max-width: 900px) {
      .player {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }

    .now {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .now img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
    }

    .now .t {
      font-size: 13px;
      font-weight: 600;
    }

    .now .a {
      font-size: 12px;
      color: var(--muted);
    }

    .controls {
      display: grid;
      gap: 8px;
      justify-items: center;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      border: 1px solid var(--border);
      background: #0f0f0f;
      color: var(--text);
      padding: 8px 10px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      transition: transform .08s ease, background .2s ease;
    }

    .btn:hover {
      background: #151515;
    }

    .btn:active {
      transform: scale(.96);
    }

    .btn.ghost {
      border-color: #2a2a2a;
      font-weight: 600;
    }

    .btn.brand {
      background: var(--brand);
      color: #000;
      border-color: transparent;
    }

    .btn.brand:hover {
      background: var(--brand-700);
    }

    .progress {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      gap: 8px;
      align-items: center;
      width: 100%;
    }

    .time {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: #272727;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--brand);
      border: 0;
      box-shadow: 0 0 8px rgba(29, 185, 84, .6);
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--brand);
      border: 0;
    }

    .right {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: flex-end;
    }

    .pill {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 12px;
      background: #0f0f0f;
    }

    .badge {
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 999px;
      background: #0c2616;
      color: #7ee2a8;
      border: 1px solid #113c22;
    }

    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 11px;
      padding: 2px 6px;
      border: 1px solid #333;
      border-bottom-width: 2px;
      border-radius: 6px;
      background: #0f0f0f;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="layout">
      <!-- Sidebar -->
      <aside class="sidebar panel" aria-label="Sidebar">
        <div class="logo" title="Spotify Inspired">
          <div class="logo-bullet"></div>
          <span class="hide-sm">Sonic</span>
        </div>

        <nav class="nav">
          <a href="#" aria-label="Home">🏠 <span class="hide-sm">Home</span></a>
          <a href="#" aria-label="Search">🔎 <span class="hide-sm">Search</span></a>
          <a href="#" aria-label="Your Library">📚 <span class="hide-sm">Your Library</span></a>
        </nav>

        <div class="library">
          <button id="newPlaylistBtn">➕
            <input type="file" id="fileInput" accept="music/*" multiple style="display:none" />
            <button id="uploadBtn">📂 Add Local Music</button>
            <span class="hide-sm">New playlist</span></button>
          <button id="likedBtn">💚 <span class="hide-sm">Liked songs</span> <span id="likedCount"
              class="badge">0</span></button>
          <p class="small hide-sm">Keyboard: <span class="kbd">Space</span> play/pause, <span class="kbd">←/→</span>
            seek, <span class="kbd">↑/↓</span> volume.</p>
        </div>
      </aside>

      <!-- Main content -->
      <main class="main panel" aria-label="Main content">
        <div class="topbar">
          <div class="search">
            <span class="icon">🔎</span>
            <input id="search" type="text" placeholder="What do you want to listen to?" aria-label="Search" />
          </div>
          <button id="shuffleBtn" class="chip" title="Toggle Shuffle">Shuffle</button>
          <button id="repeatBtn" class="chip" title="Toggle Repeat">Repeat</button>
        </div>

        <section class="section">
          <h2>Made for you</h2>
          <div id="cards" class="grid" role="list"></div>
        </section>

        <section class="section tracks">
          <table aria-label="Tracks table">
            <thead>
              <tr>
                <th>#</th>
                <th>Title</th>
                <th>Album</th>
                <th>Duration</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tracksTbody"></tbody>
          </table>
        </section>
      </main>
    </div>

    <!-- Player -->
    <footer class="player">
      <div class="now" aria-live="polite">
        <img id="nowCover" alt="cover" src="" />
        <div>
          <div id="nowTitle" class="t">—</div>
          <div id="nowArtist" class="a">—</div>
        </div>
      </div>

      <div class="controls">
        <div class="row">
          <button class="btn ghost" id="prevBtn" title="Previous">⏮</button>
          <button class="btn brand" id="playBtn" title="Play/Pause">▶</button>
          <button class="btn ghost" id="nextBtn" title="Next">⏭</button>
        </div>
        <div class="progress">
          <div id="currentTime" class="time">0:00</div>
          <input id="seek" type="range" min="0" max="100" value="0" />
          <div id="totalTime" class="time">0:00</div>
        </div>
      </div>

      <div class="right">
        <span class="pill">Queue: <span id="queueCount">0</span></span>
        <span>🔊</span>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" title="Volume" />
      </div>
      <audio id="audio"></audio>
    </footer>
  </div>

  <script>
    // --- Demo tracks (royalty-free sources) ---
    const TRACKS = [
      // {
      //   id: 'mySong',
      //   title: 'My Local Song',
      //   artist: 'Me',
      //   album: 'Custom',
      //   durationSec: 200,
      //   src: 'music/mahabharat.mp3',
      //   cover: 'cover.jpg'
      // },
      {
        id: 't1',
        title: 'SoundHelix Song 1',
        artist: 'T. Schürger',
        album: 'SoundHelix',
        durationSec: 348,
        src: 'https://www.jiosaavn.com/album/saiyaara/a,jB8phfIiI_',
        cover: 'https://c.saavncdn.com/598/Saiyaara-Hindi-2025-20250703061754-500x500.jpg'
      },
      {
        id: 't2',
        title: 'SoundHelix Song 2',
        artist: 'T. Schürger',
        album: 'SoundHelix',
        durationSec: 355,
        src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3',
        cover: 'https://picsum.photos/seed/helix2/300/300'
      },
      {
        id: 't3',
        title: 'SoundHelix Song 3',
        artist: 'T. Schürger',
        album: 'SoundHelix',
        durationSec: 356,
        src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3',
        cover: 'https://picsum.photos/seed/helix3/300/300'
      },
      {
        id: 't4',
        title: 'Creative Minds',
        artist: 'Ben Sound',
        album: 'Bensound',
        durationSec: 122,
        src: 'https://cdn.pixabay.com/download/audio/2019/06/07/audio_3bb5b1d5f4.mp3?filename=creative-minds-11238.mp3',
        cover: 'https://picsum.photos/seed/creative/300/300'
      },
      {
        id: 't5',
        title: 'Inspiring Cinematic Ambient',
        artist: 'AudioCoffee',
        album: 'Pixabay',
        durationSec: 150,
        src: 'https://cdn.pixabay.com/download/audio/2021/09/14/audio_b0a0d1b2fb.mp3?filename=inspiring-cinematic-ambient-116199.mp3',
        cover: 'https://picsum.photos/seed/ambient/300/300'
      }
    ];

    // --- State ---
    const audio = document.getElementById('audio');
    const state = {
      index: 0,
      playing: false,
      shuffle: JSON.parse(localStorage.getItem('shuffle') || 'false'),
      repeat: JSON.parse(localStorage.getItem('repeat') || 'false'),
      liked: new Set(JSON.parse(localStorage.getItem('liked') || '[]')),
      queue: [...TRACKS.map(t => t.id)],
    };

    // --- UI refs ---
    const nowCover = document.getElementById('nowCover');
    const nowTitle = document.getElementById('nowTitle');
    const nowArtist = document.getElementById('nowArtist');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const seek = document.getElementById('seek');
    const currentTimeEl = document.getElementById('currentTime');
    const totalTimeEl = document.getElementById('totalTime');
    const volume = document.getElementById('volume');
    const queueCount = document.getElementById('queueCount');
    const likedCount = document.getElementById('likedCount');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const repeatBtn = document.getElementById('repeatBtn');
    const cards = document.getElementById('cards');
    const tbody = document.getElementById('tracksTbody');
    const search = document.getElementById('search');
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");

    uploadBtn.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", (e) => {
      for (const file of e.target.files) {
        const url = URL.createObjectURL(file); // blob URL for playback
        const track = {
          id: "local-" + file.name,
          title: file.name.replace(/\.[^/.]+$/, ""), // remove extension
          artist: "Local File",
          album: "Local",
          durationSec: 0, // will fill in later
          src: url,
          cover: "https://picsum.photos/seed/" + encodeURIComponent(file.name) + "/300/300"
        };
        TRACKS.push(track);
      }
      renderLists(); // refresh UI with new tracks
    });

    function formatTime(sec) {
      if (!Number.isFinite(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function savePrefs() {
      localStorage.setItem('shuffle', JSON.stringify(state.shuffle));
      localStorage.setItem('repeat', JSON.stringify(state.repeat));
      localStorage.setItem('liked', JSON.stringify([...state.liked]));
    }

    function updateNow() {
      const t = TRACKS[state.index];
      if (!t) return;
      nowCover.src = t.cover;
      nowTitle.textContent = t.title;
      nowArtist.textContent = t.artist;
      audio.src = t.src;
      totalTimeEl.textContent = formatTime(t.durationSec);
      document.title = `${t.title} · Sonic`;
      highlightActiveRow();
    }

    function highlightActiveRow() {
      document.querySelectorAll('[data-row]')?.forEach(r => r.style.outline = 'none');
      const t = TRACKS[state.index];
      const row = document.querySelector(`[data-row="${t.id}"]`);
      if (row) row.style.outline = '1px solid #2a2a2a';
    }

    function renderLists(filter = '') {
      const q = filter.trim().toLowerCase();
      const filtered = TRACKS.filter(t => `${t.title} ${t.artist} ${t.album}`.toLowerCase().includes(q));
      // Cards
      cards.innerHTML = '';
      filtered.forEach((t) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <img class="cover" src="${t.cover}" alt="${t.title}" />
          <div style="display:flex; align-items:center; gap:8px;">
            <div>
              <div class="title">${t.title}</div>
              <div class="meta">${t.artist} • ${t.album}</div>
            </div>
            <button class="like" data-like="${t.id}">${state.liked.has(t.id) ? '💚 Liked' : '🤍 Like'}</button>
          </div>
        `;
        div.addEventListener('click', (e) => {
          if (e.target.closest('[data-like]')) return; // handled separately
          const idx = TRACKS.findIndex(x => x.id === t.id);
          if (idx > -1) { state.index = idx; updateNow(); play(); }
        });
        cards.appendChild(div);
      });

      // Table
      tbody.innerHTML = '';
      filtered.forEach((t, i) => {
        const tr = document.createElement('tr');
        tr.setAttribute('data-row', t.id);
        tr.innerHTML = `
          <td>${i + 1}</td>
          <td>
            <div style="display:flex; align-items:center; gap:10px;">
              <img src="${t.cover}" alt="${t.title}" style="width:36px; height:36px; border-radius:6px; object-fit:cover;"/>
              <div>
                <div style="font-weight:700;">${t.title}</div>
                <div class="meta">${t.artist}</div>
              </div>
            </div>
          </td>
          <td>${t.album}</td>
          <td>${formatTime(t.durationSec)}</td>
          <td style="text-align:right;">
            <button class="btn ghost" data-play="${t.id}">▶</button>
            <button class="btn ghost" data-like="${t.id}">${state.liked.has(t.id) ? '💚' : '🤍'}</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
      queueCount.textContent = filtered.length;
      likedCount.textContent = state.liked.size;
    }

    function toggleLike(id) {
      if (state.liked.has(id)) state.liked.delete(id); else state.liked.add(id);
      savePrefs();
      renderLists(search.value);
    }

    function play() {
      audio.play().then(() => { state.playing = true; playBtn.textContent = '⏸'; }).catch(() => { });
    }
    function pause() { audio.pause(); state.playing = false; playBtn.textContent = '▶'; }

    function next() {
      if (state.shuffle) {
        state.index = Math.floor(Math.random() * TRACKS.length);
      } else {
        state.index = (state.index + 1) % TRACKS.length;
      }
      updateNow();
      play();
    }
    function prev() {
      state.index = (state.index - 1 + TRACKS.length) % TRACKS.length;
      updateNow();
      play();
    }

    // --- Events ---
    playBtn.addEventListener('click', () => state.playing ? pause() : play());
    prevBtn.addEventListener('click', prev);
    nextBtn.addEventListener('click', next);
    volume.addEventListener('input', () => audio.volume = volume.value);
    seek.addEventListener('input', () => { audio.currentTime = (seek.value / 100) * (audio.duration || 0); });

    shuffleBtn.addEventListener('click', () => { state.shuffle = !state.shuffle; shuffleBtn.style.borderColor = state.shuffle ? '#1db954' : 'var(--border)'; savePrefs(); });
    repeatBtn.addEventListener('click', () => { state.repeat = !state.repeat; repeatBtn.style.borderColor = state.repeat ? '#1db954' : 'var(--border)'; savePrefs(); });

    search.addEventListener('input', () => renderLists(search.value));

    document.addEventListener('click', (e) => {
      const like = e.target.closest('[data-like]');
      if (like) { toggleLike(like.getAttribute('data-like')); return; }
      const playRow = e.target.closest('[data-play]');
      if (playRow) {
        const id = playRow.getAttribute('data-play');
        const idx = TRACKS.findIndex(t => t.id === id);
        if (idx > -1) { state.index = idx; updateNow(); play(); }
      }
    });

    audio.addEventListener('timeupdate', () => {
      const d = audio.duration || 0; const c = audio.currentTime || 0;
      seek.value = d ? (c / d) * 100 : 0;
      currentTimeEl.textContent = formatTime(c);
      totalTimeEl.textContent = formatTime(d || TRACKS[state.index]?.durationSec || 0);
    });
    audio.addEventListener('ended', () => { if (state.repeat) { audio.currentTime = 0; play(); } else { next(); } });

    document.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      if (e.code === 'Space') { e.preventDefault(); state.playing ? pause() : play(); }
      if (e.code === 'ArrowRight') { audio.currentTime = Math.min((audio.currentTime || 0) + 5, audio.duration || 0); }
      if (e.code === 'ArrowLeft') { audio.currentTime = Math.max((audio.currentTime || 0) - 5, 0); }
      if (e.code === 'ArrowUp') { e.preventDefault(); volume.value = Math.min(parseFloat(volume.value) + 0.05, 1).toFixed(2); audio.volume = volume.value; }
      if (e.code === 'ArrowDown') { e.preventDefault(); volume.value = Math.max(parseFloat(volume.value) - 0.05, 0).toFixed(2); audio.volume = volume.value; }
    });

    document.getElementById('newPlaylistBtn').addEventListener('click', () => {
      alert('Playlists are demo-only in this single-file build. Duplicate this file and customize TRACKS to create themed playlists.');
    });

    document.getElementById('likedBtn').addEventListener('click', () => {
      if (!state.liked.size) return alert('No liked songs yet. Click 🤍 to like.');
      const ids = [...state.liked];
      const names = ids.map(id => TRACKS.find(t => t.id === id)?.title).filter(Boolean).join('\n• ');
      alert('Liked songs:\n• ' + names);
    });

    // Initial render
    shuffleBtn.style.borderColor = state.shuffle ? '#1db954' : 'var(--border)';
    repeatBtn.style.borderColor = state.repeat ? '#1db954' : 'var(--border)';
    renderLists();
    updateNow();
    audio.volume = volume.value;


  </script>
</body>

</html>
