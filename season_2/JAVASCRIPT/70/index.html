<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .box {
            height: 344px;
            width: 688px;
            margin: 34px;
            padding: 34px;
            border: 2px solid black;
            border-radius: 8px;
            /* background-color: rgb(185, 208, 216); */
            font-size: 24px;
            /* text-align: center; */
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000000;


        }

        .container {
            display: flex;
            /* flex-direction: row; */
            flex-direction: column;
            align-items: center;
            /* background-color: #000000; */
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">chhotabheem</div>
        <div class="box">chhotabheem</div>
        <div class="box">chhotabheem</div>
        <div class="box">chhotabheem</div>
        <div class="box">chhotabheem</div>
    </div>


    <script>
        // Function to generate a random hex color
        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        // Select all elements with class "box"
        const boxes = document.querySelectorAll('.box');

        boxes.forEach(box => {
            box.style.color = getRandomColor();           // Random text color
            box.style.backgroundColor = getRandomColor(); // Random background color
        });
    </script>

</body>

</html>
