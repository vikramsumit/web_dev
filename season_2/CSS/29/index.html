<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Switch Card</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #e0e0e0;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 300px;
            background-color: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            padding: 16px;
            text-align: center;
        }

        .box:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .main-img {
            width: 98%;
            height: auto;
            border-radius: 20px;
            border: 2px solid #ccc;
            transition: all 0.3s ease;
        }

        .main-img:hover {
            transform: scale(1.1);
            filter: brightness(0.9);
            border-color: #ffffff;
        }

        h1 {
            font-size: 1.25rem;
            margin: 12px 0;
        }

        p {
            /* text-align: justify; */
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 12px 0 12px 0;
        }

        button {
            flex: 1 1 45%;
            padding: 8px;
            border: none;
            border-radius: 16px;
            background-color: bisque;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #e6c0a6;
        }

        @media (min-width: 1600px) {
            .box {
                width: 500px;
                padding: 24px;
            }

            h1 {
                font-size: 1.75rem;
            }

            p {
                font-size: 1rem;
            }

            button {
                padding: 12px;
                font-size: 1rem;
            }
        }

        @media (max-width: 500px) and (orientation: portrait) {
            body {
                align-items: flex-start;
                padding-top: 20px;
            }

            .box {
                width: 90%;
                padding: 12px;
            }

            h1 {
                font-size: 1.1rem;
            }

            p {
                font-size: 0.85rem;
            }

            .btn-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="box">
        <img id="mainImage" class="main-img" src="lake.jpeg" alt="Main Image" />
        <div class="btn-group">
            <button onclick="changeImage('nature.jpeg')">Nature</button>
            <button onclick="changeImage('lake.jpeg')">Lake</button>
        </div>
        <h1>Lorem ipsum sit.</h1>
        <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Cupiditate aut esse eum totam odio Lorem ipsum
            dolor sit amet consectetur, adipisicing elit. Ipsam, tenetur? Nesciunt.
        </p>
    </div>

    <script>
        function changeImage(imageSrc) {
            document.getElementById("mainImage").src = imageSrc;
        }
    </script>
</body>

</html>
