<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Landing Page Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="img/logo.svg" alt="Netflix Logo">
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">TV Shows</a></li>
                <li><a href="#">Movies</a></li>
                <li><a href="#">New & Popular</a></li>
                <li><a href="#">My List</a></li>
            </ul>
        </nav>
        <div class="controls">
            <span class="icon icon-search"></span>
            <a href="#">Kids</a>
            <span class="icon icon-bell"></span>
            <span class="icon icon-avatar"></span>
        </div>
    </header>
    <main>
        <section class="hero">
            <h1>Big Title</h1>
            <p>Short tagline goes here.</p>
            <div class="buttons">
                <a href="#" class="btn btn--play">Play</a>
                <a href="#" class="btn btn--info">More Info</a>
            </div>
        </section>
        <section class="row">
            <h2>Trending Now</h2>
            <div class="cards">
                <div class="card"><img src="https://www.dotyeti.com/wp-content/uploads/2023/01/image5-1-691x1024.jpg" alt="Movie 1"></div>
                <div class="card"><img src="https://i.pinimg.com/736x/fc/bb/c4/fcbbc42ffe5a402a61ff519ab6cdefee.jpg" alt="Movie 2"></div>
                <div class="card"><img src="https://www.dotyeti.com/wp-content/uploads/2023/01/barbie.webp" alt="Movie 3"></div>
                <!-- Add more cards -->
            </div>
        </section>
        <section class="row">
            <h2>Top Rated</h2>
            <div class="cards">
                <div class="card"><img src="https://m.media-amazon.com/images/M/MV5BMDAyY2FhYjctNDc5OS00MDNlLThiMGUtY2UxYWVkNGY2ZjljXkEyXkFqcGc@._V1_FMjpg_UX1200_.jpg" alt="Movie 4"></div>
                <div class="card"><img src="https://m.media-amazon.com/images/M/MV5BMTZkMjBjNWMtZGI5OC00MGU0LTk4ZTItODg2NWM3NTVmNWQ4XkEyXkFqcGc@._V1_FMjpg_UX800_.jpg" alt="Movie 5"></div>
                <div class="card"><img src="https://m.media-amazon.com/images/M/MV5BMTMxNTMwODM0NF5BMl5BanBnXkFtZTcwODAyMTk2Mw@@._V1_FMjpg_UY2048_.jpg" alt="Movie 6"></div>
                <!-- Add more cards -->
            </div>
        </section>
        <section class="row">
            <h2>Action Movies</h2>
            <div class="cards">
                <div class="card"><img src="https://m.media-amazon.com/images/M/MV5BNDYxNjQyMjAtNTdiOS00NGYwLWFmNTAtNThmYjU5ZGI2YTI1XkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg" alt="Movie 7"></div>
                <div class="card"><img src="https://m.media-amazon.com/images/M/MV5BOTY4YjI2N2MtYmFlMC00ZjcyLTg3YjEtMDQyM2ZjYzQ5YWFkXkEyXkFqcGdeQXVyMTQxNzMzNDI@._V1_.jpg" alt="Movie 8"></div>
                <div class="card"><img src="https://m.media-amazon.com/images/M/MV5BOTAzODEzNDAzMl5BMl5BanBnXkFtZTgwMDU1MTgzNzE@._V1_.jpg" alt="Movie 9"></div>
                <!-- Add more cards -->
            </div>
        </section>
    </main>
    <footer>
        <div class="footer-links">
            <ul>
                <li><a href="#">FAQ</a></li>
                <li><a href="#">Help Center</a></li>
                <li><a href="#">Account</a></li>
            </ul>
            <ul>
                <li><a href="#">Media Center</a></li>
                <li><a href="#">Investor Relations</a></li>
                <li><a href="#">Jobs</a></li>
            </ul>
            <!-- Add more columns -->
        </div>
        <p>&copy; 2025 Netflix, Inc.</p>
    </footer>
</body>
</html>
